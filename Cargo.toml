[workspace]
resolver = "2"

members = [
    "download-cef",
    "get-latest",
    "update-bindings",
    "export-cef-dir",
    "sys",
    "cef",
    "tanso-build",
]

[workspace.package]
version = "154.5.0+154.0.33"
edition = "2021"
license = "Apache-2.0 OR MIT"
authors = [
    "Wu Yu Wei <yuweiwu@pm.me>",
    "Bill Avery <wravery@gmail.com>",
    "csmoe <csmoe@msn.com>",
]
repository = "https://github.com/kurogane-rs/tanso"

[workspace.dependencies]
tanso-sys = { version = "=154.5.0", path = "sys" }
tanso-download = { version = "4.0", path = "download-cef" }

anyhow = "1"
bindgen = "0.73"
clap = { version = "4", features = ["derive"] }
convert_case = "0.12"
libloading = "0.9"
objc2 = "0.6.3"
proc-macro2 = "1"
quote = "1"
regex = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "3", features = ["full"] }
thiserror = "2"
toml_edit = "0.25"

[workspace.dependencies.windows-sys]
version = "0.61"
features = ["Win32_System_Environment", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"]
