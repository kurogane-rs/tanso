name: Rust validation

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Check fmt
        run: cargo fmt --check

      - name: Cache CEF
        id: cache-cef
        uses: actions/cache@v6.1.0
        with:
          path: ~/.local/share/cef
          key: cef-${{ matrix.os }}-${{ hashFiles('Cargo.toml') }}

      - name: ${{ steps.cache-cef.outputs.cache-hit && 'Use cache' || 'Export CEF' }}
        run: |
          ${{ steps.cache-cef.outputs.cache-hit && 'echo "Cached CEF"'
            || (matrix.os == 'windows-latest'
              && 'cargo run -p export-cef-dir -- "$env:USERPROFILE/.local/share/cef"'
              || 'cargo run -p export-cef-dir -- "$HOME/.local/share/cef"')
          }}
          echo "CEF_PATH=${{ matrix.os == 'windows-latest'
            && '$env:USERPROFILE'
            || '$HOME'
          }}/.local/share/cef" >> "$${{ matrix.os == 'windows-latest'
            && 'env:'
            || ''
          }}GITHUB_ENV"

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  # 32-bit Windows, whose CEF callbacks use the stdcall convention
  windows-x86:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Add the target
        run: rustup target add i686-pc-windows-msvc

      - name: Cache CEF
        id: cache-cef
        uses: actions/cache@v6.1.0
        with:
          path: ~/.local/share/cef-x86
          key: cef-windows-x86-${{ hashFiles('Cargo.toml') }}

      - name: Export CEF
        if: steps.cache-cef.outputs.cache-hit != 'true'
        run: cargo run -p export-cef-dir -- --target i686-pc-windows-msvc "$env:USERPROFILE/.local/share/cef-x86"

      # Windows asks to elevate a 32-bit executable named like an installer,
      # which update-bindings' test binary is; the generator runs on the host
      - name: Run tests
        run: |
          $env:CEF_PATH = "$env:USERPROFILE/.local/share/cef-x86"
          cargo test --verbose --target i686-pc-windows-msvc --workspace --exclude update-bindings

  cross-compile-windows:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          # cargo-xwin links with LLVM's lld-link; nothing is compiled from C++
          sudo apt-get update -q
          sudo apt-get install -yq clang lld llvm
          rustup target add x86_64-pc-windows-msvc
          pipx install cargo-xwin
          echo "CARGO_XWIN_VERSION=$(cargo xwin --version | awk '{print $NF}')" >> "$GITHUB_ENV"

      # Only the SDK itself: cargo-xwin symlinks `clang-cl` to the `clang` found on PATH
      # next to it, and that must be recreated for the toolchain installed above. The
      # SDK and CRT versions come from the cargo-xwin release, so key on it.
      - name: Cache Windows SDK
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/cargo-xwin/xwin
          key: cargo-xwin-sdk-${{ runner.os }}-${{ env.CARGO_XWIN_VERSION }}

      - name: Build
        run: cargo xwin build -p tanso --target x86_64-pc-windows-msvc --verbose

  # Kurogane is tanso's acceptance suite: its CI's clippy and tests run on
  # this tanso, through a path patch that lives only in this job
  kurogane:
    name: Kurogane on this tanso (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          path: tanso

      - uses: actions/checkout@v7
        with:
          repository: 0x48piraj/kurogane
          path: kurogane

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq pkg-config libssl-dev

      # Kurogane's tanso entries point at this checkout whatever it pins. A
      # patch applies only while Kurogane's exact pin matches this tanso's
      # version which tanso's version bump breaks before Kurogane's follows
      - name: Point Kurogane at this tanso
        working-directory: kurogane
        run: |
          # Forward slashes
          TANSO="$(cygpath -m "$GITHUB_WORKSPACE" 2>/dev/null || echo "$GITHUB_WORKSPACE")/tanso"
          sed -i.orig -E \
            -e "s|^tanso = .*|tanso = { path = \"$TANSO/cef\", default-features = false }|" \
            -e "s|^tanso-sys = .*|tanso-sys = { path = \"$TANSO/sys\" }|" \
            -e "s|^tanso-download = .*|tanso-download = { path = \"$TANSO/download-cef\" }|" \
            -e "s|^tanso-build = .*|tanso-build = { path = \"$TANSO/tanso-build\" }|" \
            Cargo.toml
          rm Cargo.toml.orig
          git diff Cargo.toml

      # A tanso crate taken from anywhere but this checkout, or taken twice,
      # means the job tests another tanso
      - name: Check that Kurogane takes every tanso crate from this tanso
        working-directory: kurogane
        run: |
          cargo metadata --format-version 1 > "$RUNNER_TEMP/metadata.json"
          for crate in tanso tanso-sys tanso-download tanso-build; do
            if ! jq -e --arg crate "$crate" \
              '[.packages[] | select(.name == $crate)] | length == 1 and .[0].source == null' \
              "$RUNNER_TEMP/metadata.json" > /dev/null; then
              echo "Kurogane takes $crate from elsewhere"
              exit 1
            fi
          done

      - name: Clippy
        working-directory: kurogane
        run: |
          cargo clippy -p kurogane -p kurogane-build -p kurogane-layout -p kurogane-cli --all-targets \
            -- -D warnings

      - name: Test
        working-directory: kurogane
        run: |
          cargo test -p kurogane --lib
          cargo test -p kurogane-layout -p kurogane-cli
